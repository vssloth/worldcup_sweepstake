name: Update Predictions

on:
  workflow_dispatch:   # manual run button
  schedule:
    - cron: "0 8 * * *"   # 8am UTC (≈ 8am BST in winter, 9am BST in summer)

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright requests
          playwright install chromium

      - name: Run scraper
        run: |
          python scraper.py

      - name: Run update script
        run: |
          python update_predictions.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.db
          git commit -m "Update predictions [skip ci]" || echo "No changes to commit"
          git push
