name: Update World Cup Predictions

on:
  schedule:
    - cron: "0 7 * * *"  # 8am BST (7am UTC)
  workflow_dispatch:  # manual run button

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Playwright needs this)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install pandas requests playwright
          playwright install chromium

      - name: Run prediction scraper
        run: python update_predictions.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.db
          git commit -m "Update predictions" || echo "No changes"
          git push
